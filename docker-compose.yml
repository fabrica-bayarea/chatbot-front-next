services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
        NEXT_PUBLIC_SUPABASE_URL: ""
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      NEXT_PUBLIC_SUPABASE_URL: ""
      OPENAI_API_KEY: ""
      RESEND_API_KEY: ""
      UPLOADTHING_APP_ID: ""
      UPLOADTHING_SECRET: ""
    command: npm run start
